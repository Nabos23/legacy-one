[project]
name = "legacy-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "motor>=3.3.2",
    "langfuse>=2.0.0,<3.0.0",
    "langgraph>=1.2.4",
    "litellm>=1.40.0",
    "pydantic>=2.0.0",
    "pymongo>=4.0.0",
    "bcrypt>=5.0.0",
    "python-jose[cryptography]>=3.5.0",
    "email-validator>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "starlette-admin>=0.14.1",
    "odmantic>=1.0.2",
    "itsdangerous>=2.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "pymysql>=1.1.0",
    "mcp>=1.9.0",
    "qdrant-client>=1.9.0",
    "pyodbc>=5.0.0",
    "tzdata>=2026.2",
    "ddgs>=9.14.4",
    "google-api-python-client>=2.198.0",
    "google-auth>=2.55.1",
    "google-auth-oauthlib>=1.4.0",
    "google-cloud-firestore>=2.21.0",
    "httpx>=0.28.1",
    "slack-sdk>=3.33.0",
    "python-multipart>=0.0.9",
    "weasyprint>=62.0",
    "markdown>=3.7",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "pymupdf>=1.28.0",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "pytesseract>=0.3.13",
    "pillow>=12.3.0",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "croniter>=6.2.2",
    "sentry-sdk[fastapi]>=2.0.0",
    "fastembed>=0.8.0",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
markers = [
    "integration: tests that make real external connections (e.g. live MCP servers)",
]
